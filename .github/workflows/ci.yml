name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖（样片渲染与中文字体）
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk

      - name: 安装 Python 依赖
        run: pip install pillow

      - name: 单元测试
        run: make test

      - name: 端到端 demo
        run: bash scripts/run_all_demos.sh
